# The keel theme's demo site (app install -demo-set keel): a studio
# making websites and apps - its services, projects, team, clients'
# quotes, contacts and a request form, the front page made of the
# theme's bands. Everything here is ordinary content and blocks, edited
# in the admin. The pictures - the projects', the team's, the clinic's
# screens - are the theme's own (demo/images), copied into the site's
# files on install.
site:
  slogan: A studio building digital products
  front_page_view: services_home
  main_menu: main
  footer_menu: footer

users:
  - client_maria
  - client_oliver

image_styles:
  - {name: keel_card, label: Card, width: 720, height: 450, mode: fill, anchor: focal, hidpi: true}
  - {name: keel_wide, label: Wide, width: 1200, height: 640, mode: fill, anchor: focal, hidpi: true}
  - {name: keel_portrait, label: Portrait, width: 480, height: 600, mode: fill, anchor: focal, hidpi: true}

vocabularies:
  - name: directions
    label: Directions
    path: directions
    terms: [Web service, Mobile app, Customer portal, Design]

field_storages:
  - {name: field_term, type: text}
  - {name: field_price, type: text}
  - {name: field_direction, type: taxonomy, vocabulary: directions}
  - {name: field_client, type: text}
  - {name: field_year, type: number, config: {number_kind: integer}}
  - {name: field_site, type: link}
  - {name: field_services, type: reference, target: [service], multiple: true}

content_types:
  - name: service
    label: Service
    description: What the company does for its clients.
    path: services
    comments: hidden
    fields:
      - {storage: field_term, label: Timeline, show_on_detail: true, show_label: true, sort_order: 10, display_order: 0}
      - {storage: field_price, label: Price, show_on_detail: true, show_label: true, sort_order: 20, display_order: 1}
      - {storage: field_body, label: Description, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 0, display_order: 10}
  - name: project
    label: Project
    description: A project for a client - the task, the solution, the result.
    path: projects
    comments: hidden
    fields:
      - {storage: field_image, label: Cover, show_on_detail: true, detail_image_style: keel_wide, list_image_style: keel_card, sort_order: 0, display_order: 20}
      - {storage: field_direction, label: Direction, show_on_detail: true, sort_order: 10, display_order: 0}
      - {storage: field_client, label: Client, show_on_detail: true, show_label: true, sort_order: 20, display_order: 1}
      - {storage: field_term, label: Timeline, show_on_detail: true, show_label: true, sort_order: 30, display_order: 2}
      - {storage: field_year, label: Year, show_on_detail: true, show_label: true, sort_order: 40, display_order: 3}
      - {storage: field_site, label: Website, show_on_detail: true, show_label: true, sort_order: 50, display_order: 4}
      - {storage: field_services, label: Services, widget: autocomplete, show_on_detail: true, show_label: true, sort_order: 60, display_order: 5}
      - {storage: field_body, label: Description, widget: textarea, text_formats: [basic_html, plain_text], show_on_detail: true, renders_in_body: true, sort_order: 70, display_order: 30}
  - name: person
    label: Team member
    description: Someone on the team - a photo and a role.
    path: team
    comments: hidden
    fields:
      - {storage: field_image, label: Photo, show_on_detail: true, detail_image_style: keel_portrait, list_image_style: keel_portrait, sort_order: 0, display_order: 0}
      - {storage: field_body, label: Role, widget: textarea, text_formats: [plain_text, basic_html], show_on_detail: true, renders_in_body: true, sort_order: 10, display_order: 10}
  - name: review
    label: Review
    description: A client's words about the work; the title is who said them.
    path: reviews
    comments: hidden
    fields:
      - {storage: field_body, label: Review, widget: textarea, text_formats: [plain_text, basic_html], show_on_detail: true, renders_in_body: true, sort_order: 0, display_order: 0}

nodes:
  - key: svc_web
    type: service
    title: Web development
    ago: 40d
    fields:
      field_term: from 8 weeks
      field_price: from $12,000
      field_body: |
        <p>Company websites, customer portals and services with integrations - from a prototype to the launch and beyond.</p>
        <h2>What's included</h2>
        <ul>
        <li><strong>Research and a prototype.</strong> Scenarios, the pages' structure, a clickable prototype.</li>
        <li><strong>Design.</strong> The interface and a design system in your brand.</li>
        <li><strong>Development.</strong> The site or the service, its admin, integrations with your systems.</li>
        <li><strong>Launch.</strong> Data migration, load testing, monitoring.</li>
        </ul>
        <h2>How we work</h2>
        <ol>
        <li><strong>Briefing.</strong> Goals, audience, constraints - a week.</li>
        <li><strong>Prototype.</strong> The scenarios tested before the design - two weeks.</li>
        <li><strong>Design and development.</strong> Two-week sprints, each with a demo.</li>
        <li><strong>Launch.</strong> Release, monitoring, the first fixes.</li>
        </ol>
        <h2>Questions we hear</h2>
        <h3>Who owns the code?</h3>
        <p>You do: the code and the design are yours once a stage is paid for.</p>
        <h3>What happens after the launch?</h3>
        <p>Support by the hour or a fixed package: fixes, updates, monitoring.</p>
  - key: svc_mobile
    type: service
    title: Mobile apps
    ago: 39d
    fields:
      field_term: from 10 weeks
      field_price: from $16,000
      field_body: |
        <p>Apps for iOS and Android - from a prototype to the app stores and growth after the launch.</p>
        <h2>What's included</h2>
        <ul>
        <li><strong>Prototype.</strong> Scenarios and screens tested with real users.</li>
        <li><strong>Design.</strong> An interface following each platform's guidelines.</li>
        <li><strong>Development.</strong> Native or cross-platform - whichever fits the task.</li>
        <li><strong>Backend.</strong> An API, an admin, push notifications.</li>
        <li><strong>Publishing.</strong> Getting ready for the App Store and Google Play.</li>
        </ul>
        <h2>Questions we hear</h2>
        <h3>Can we start with one platform?</h3>
        <p>Yes: it often pays to release on one platform, see the demand, and only then build the other.</p>
  - key: svc_design
    type: service
    title: Interface design
    ago: 38d
    fields:
      field_term: from 4 weeks
      field_price: from $6,000
      field_body: |
        <p>Research, prototypes and design systems for products that have to be easy to use.</p>
        <h2>What's included</h2>
        <ul>
        <li><strong>Research.</strong> Interviews with users, a look at the competitors.</li>
        <li><strong>Prototype.</strong> The structure and the scenarios, tested with people.</li>
        <li><strong>Design system.</strong> Components your team uses without us.</li>
        </ul>
  - key: svc_support
    type: service
    title: Support and growth
    ago: 37d
    fields:
      field_term: from 1 month
      field_price: from $2,000 a month
      field_body: |
        <p>Maintenance, improvements and monitoring after the launch - of our projects and others'.</p>
        <h2>What's included</h2>
        <ul>
        <li><strong>Monitoring.</strong> Uptime and errors watched around the clock.</li>
        <li><strong>Updates.</strong> Security, dependencies, new platform versions.</li>
        <li><strong>Improvements.</strong> New features on a quarterly plan.</li>
        </ul>

  - key: prj_clinic
    type: project
    title: Online booking for a chain of clinics
    ago: 20d
    fields:
      field_image: {file: images/prj-clinic.jpg}
      field_direction: Web service
      field_client: Wellpoint Clinics
      field_term: 5 months
      field_year: 2026
      field_site: {url: "https://example.com", title: example.com}
      field_services: [svc_web, svc_design]
      field_body: |
        <p>Patients book a doctor in three steps; the front desk sees every branch's schedule in one window.</p>
        <h2>The task</h2>
        <p>Bookings came by phone: at busy hours nobody could get through, and the branches' schedules lived in three different systems.</p>
        <h2>The solution</h2>
        <p>Online booking with a choice of doctor and time, an integration with the clinics' medical system, reminders for patients and a desk for the administrators.</p>
        <h2>The result</h2>
        <ul>
        <li><strong>64%</strong> of bookings made online</li>
        <li><strong>-40%</strong> calls to the front desk</li>
        <li><strong>12</strong> branches in one window</li>
        </ul>
  - key: prj_bakery
    type: project
    title: Delivery for a bakery
    ago: 15d
    fields:
      field_image: {file: images/prj-bakery.jpg}
      field_direction: Mobile app
      field_client: Morning Bakery
      field_term: 4 months
      field_year: 2026
      field_services: [svc_mobile, svc_design]
      field_body: |
        <p>The menu, the payment and the courier on a map, in one app.</p>
        <h2>The task</h2>
        <p>Orders came through messengers, couriers lost addresses, and regulars never heard about what was new.</p>
        <h2>The solution</h2>
        <p>An app with the menu and payments, the courier on a live map, a loyalty programme.</p>
  - key: prj_logistics
    type: project
    title: A customer portal for a logistics company
    ago: 10d
    fields:
      field_image: {file: images/prj-logistics.jpg}
      field_direction: Customer portal
      field_client: Transline
      field_term: 6 months
      field_year: 2025
      field_services: [svc_web, svc_support]
      field_body: |
        <p>Orders, documents and the state of each shipment, without calling a manager.</p>
        <h2>The solution</h2>
        <p>A portal for shipping orders, electronic documents and shipments' status straight from the accounting system.</p>
  - key: prj_fitness
    type: project
    title: A training diary
    ago: 8d
    fields:
      field_image: {file: images/prj-fitness.jpg}
      field_direction: Mobile app
      field_client: Pulse Studio
      field_term: 3 months
      field_year: 2025
      field_services: [svc_mobile]
      field_body: |
        <p>Training plans, progress and booking a class, in one app.</p>
  - key: prj_office
    type: project
    title: Passes for an office centre
    ago: 5d
    fields:
      field_image: {file: images/prj-office.jpg}
      field_direction: Mobile app
      field_client: North Point Offices
      field_term: 2 months
      field_year: 2025
      field_services: [svc_mobile, svc_support]
      field_body: |
        <p>A guest pass in a minute: the tenant issues it, security sees it, the guest walks in with a QR code.</p>
  - key: prj_brand
    type: project
    title: A design system for a bank
    ago: 3d
    fields:
      field_image: {file: images/prj-brand.jpg}
      field_direction: Design
      field_client: Keystone Bank
      field_term: 4 months
      field_year: 2026
      field_services: [svc_design]
      field_body: |
        <p>A hundred and twenty components that five product teams use without the studio's designers.</p>

  - key: person_anna
    type: person
    title: Anna Hale
    ago: 60d
    fields: {field_image: {file: images/person-anna.jpg}, field_body: Project lead}
  - key: person_ian
    type: person
    title: Ian Brooks
    ago: 59d
